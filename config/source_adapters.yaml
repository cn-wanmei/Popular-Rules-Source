version: 2
adapters:
  official_web:
    enabled: true
    method: html_domain_extraction
    timeout_seconds: 45
    retry_attempts: 2
    retry_backoff_seconds: 2
    max_bytes: 5000000
    user_agent: "Popular-Rules-Source/1.x"
  official_json:
    enabled: false
    method: structured_json
    notes: "Disabled until a live official endpoint and field-path contract exist. Test fixtures are never production inputs."
services:
  "1688": {adapters: [official_web]}
  cainiao: {adapters: [official_web]}
  dingding: {adapters: [official_web]}
  qqmail: {adapters: [official_web]}
  qqmusic: {adapters: [official_web]}
  taobao: {adapters: [official_web]}
  tencentcloud: {adapters: [official_web]}
  tmall: {adapters: [official_web]}
