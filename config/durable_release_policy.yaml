# Durable release processing policy (Source)
#
# Terminology (do not collapse into "8-service"):
# - production_cohort: services in lifecycle production + Collection binding
# - durable_processing_batch: services included in Durable Source Bridge default matrix
# - weekly_promotion_quota: Collection canary intake (see Collection funnel docs)
# - collection_active_binding: sources/immutable_registry on Collection
#
# This file is operational policy, not lifecycle SSOT.
# Lifecycle SSOT remains config/source_canary_state.yaml.

schema: popular_rules_source_durable_release_policy_v1

default_processing_batch:
  - mediatek
  - mercadolibre
  - micron
  - mihome
  - nec
  - netapp
  - netflix
