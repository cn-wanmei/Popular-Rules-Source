  - zhaopin

# Historical production cohort label (Collection-bound); not the durable matrix size.
production_cohort_note: >
  Production cohort size is defined by lifecycle SSOT + Collection immutable
  bindings, not by the durable bridge matrix length.

selective_execution:
  workflow: durable-source-bridge.yml
  input: services
  modes:
    empty_or_default: use default_processing_batch
    comma_list: process only listed service ids
