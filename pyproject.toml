[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popular-rules-source"
version = "0.4.0"
description = "Official-source-driven service domain source generator"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.21,<5",
]

[project.scripts]
source-engine = "source_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
