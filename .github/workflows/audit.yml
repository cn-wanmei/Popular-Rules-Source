name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m source_engine audit
      - run: python -m source_engine dod
      - uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/
