
name: Collection Auto Handoff

on:
  workflow_run:
    workflows: ["Durable Source Bridge"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "reports/durable-bridge/latest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Validate durable seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          report = Path("reports/durable-bridge/latest.json")
          if not report.is_file():
              raise SystemExit("durable bridge seal missing")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("schema") != "popular_rules_source_durable_bridge_v2":
              raise SystemExit(f"unexpected bridge schema: {data.get('schema')}")
          verified = str(data.get("verified_input_commit") or "")
          persisted = str(data.get("persistence_commit") or "")
          sha = re.compile(r"^[0-9a-f]{40}$")
          if not sha.fullmatch(verified):
              raise SystemExit(f"invalid verified_input_commit: {verified}")
          if not sha.fullmatch(persisted):
              raise SystemExit(f"invalid persistence_commit: {persisted}")
          if verified == persisted:
              raise SystemExit("verified_input_commit must identify the gate input, not the persistence seal")
          services = data.get("services") or {}
          expected = {"1688", "cainiao", "dingding", "qqmail", "qqmusic", "taobao", "tencentcloud", "tmall"}
          if set(services) != expected:
              raise SystemExit(f"durable service set mismatch: {sorted(services)}")
          for sid, item in sorted(services.items()):
              if item.get("status") != "PERSISTED":
                  raise SystemExit(f"{sid}: durable status is {item.get('status')}")
              for key in ("snapshot_id", "content_digest", "evidence_digest", "policy_digest", "generator_digest", "release_digest", "release_identity_version", "release_path"):
                  if not str(item.get(key) or "").strip():
                      raise SystemExit(f"{sid}: missing {key}")
          PY

      - name: Prepare Collection repository
        env:
          COLLECTION_REPO_TOKEN: ${{ secrets.COLLECTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COLLECTION_REPO_TOKEN" || {
            echo "COLLECTION_REPO_TOKEN is required for cross-repository immutable handoff." >&2
            exit 2
          }
          git clone "https://x-access-token:$COLLECTION_REPO_TOKEN@github.com/cn-wanmei/Popular-Rules-Collection.git" collection
          git -C collection fetch origin main
          git -C collection checkout main
          git -C collection reset --hard origin/main

      - name: Build immutable registry handoff
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import yaml

          source = json.loads(Path("reports/durable-bridge/latest.json").read_text(encoding="utf-8"))
          registry_path = Path("collection/sources/immutable_registry.yaml")
          registry = yaml.safe_load(registry_path.read_text(encoding="utf-8")) or {}
          bindings = registry.get("bindings") or {}
          if not isinstance(bindings, dict):
              raise SystemExit("Collection immutable registry bindings must be a mapping")
          for sid, item in sorted(source["services"].items()):
              snapshot_id = str(item["snapshot_id"])
              release_path = Path(str(item["release_path"]))
              if not release_path.parts or release_path.parts[0] != "releases":
                  raise SystemExit(f"{sid}: unsafe release_path {release_path}")
              release_file = Path(release_path)
              if not release_file.is_file():
                  raise SystemExit(f"{sid}: release artifact not found in Source checkout: {release_file}")
              release = json.loads(release_file.read_text(encoding="utf-8"))
              expected = {
                  "service_id": sid,
                  "snapshot_id": snapshot_id,
                  "content_digest": str(item["content_digest"]),
                  "evidence_digest": str(item["evidence_digest"]),
                  "policy_digest": str(item["policy_digest"]),
                  "generator_digest": str(item["generator_digest"]),
                  "release_digest": str(item["release_digest"]),
                  "release_identity_version": str(item["release_identity_version"]),
              }
              for key, value in expected.items():
                  if release.get(key) != value:
                      raise SystemExit(f"{sid}: release {key} mismatch")
              domains_path = release_file.parent / "domains.txt"
              if not domains_path.is_file():
                  raise SystemExit(f"{sid}: release domains.txt missing")
              expected_sha256 = hashlib.sha256(domains_path.read_bytes()).hexdigest()
              binding = bindings.setdefault(sid, {})
              binding.update({
                  "status": "active",
                  "source_id": "popular-rules-source",
                  "source_ref": str(source["persistence_commit"]),
                  "verified_input_commit": str(source["verified_input_commit"]),
                  "artifact_path": f"generated/source/{sid}/domains.txt",
                  "release_path": str(release_path),
                  "snapshot_id": snapshot_id,
                  "content_digest": str(item["content_digest"]),
                  "evidence_digest": str(item["evidence_digest"]),
                  "policy_digest": str(item["policy_digest"]),
                  "generator_digest": str(item["generator_digest"]),
                  "release_digest": str(item["release_digest"]),
                  "release_identity_version": str(item["release_identity_version"]),
                  "expected_sha256": expected_sha256,
              })
          registry["schema"] = "popular_rules_collection_immutable_source_registry_v2"
          registry_path.write_text(yaml.safe_dump(registry, allow_unicode=True, sort_keys=False), encoding="utf-8")
          PY

      - name: Open immutable Collection PR
        env:
          COLLECTION_REPO_TOKEN: ${{ secrets.COLLECTION_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.COLLECTION_REPO_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          cd collection
          BRANCH="automation/source-handoff-$WORKFLOW_RUN_ID"
          if gh pr list --repo cn-wanmei/Popular-Rules-Collection --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^1$'; then
            echo "Collection handoff PR already exists on $BRANCH."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/immutable_registry.yaml
          if git diff --cached --quiet; then
            echo "Collection immutable registry already matches the durable Source seal."
            exit 0
          fi
          git commit -m "chore(source): promote immutable Source durable seal"
          git push --set-upstream origin "$BRANCH"
          gh pr create             --repo cn-wanmei/Popular-Rules-Collection             --base main             --head "$BRANCH"             --title "chore(source): promote immutable Source durable seal"             --body "Automated Source→Collection handoff. This PR updates immutable Source bindings from the verified durable bridge seal. Collection source gates and canary/production gates remain authoritative."
