name: Cloudflare Candidate Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/services.yaml"
      - "config/self_built_services.yaml"
      - "self_built/cloudflare/**"
      - "authoring/services/cloudflare/**"
      - "source_engine/overrides.py"
      - "source_engine/build.py"

concurrency:
  group: cloudflare-candidate-refresh
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Validate Source configuration
        run: python -m source_engine validate

      - name: Generate Cloudflare candidate only
        run: |
          set -euo pipefail
          # The generate CLI writes its validation summary before the JSON array.
          # Keep only the JSON payload for the next machine-readable verification step.
          python -m source_engine generate --service cloudflare --allow-blocked \
            | sed -n '/^\[/,$p' > cloudflare-generation.json
          test -s cloudflare-generation.json

      - name: Verify candidate domains and evidence mapping
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("cloudflare-generation.json").read_text(encoding="utf-8"))
          if len(results) != 1 or results[0].get("service_id") != "cloudflare":
              raise SystemExit("expected exactly one Cloudflare generation result")
          result = results[0]
          snapshot = Path("snapshots") / result["snapshot_id"]
          domains = [
              line.strip()
              for line in (snapshot / "domains.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          provenance = json.loads((snapshot / "provenance.json").read_text(encoding="utf-8"))
          evidence = {
              item.get("evidence_id"): item
              for item in provenance.get("evidence", [])
              if item.get("evidence_id")
          }
          assets = {
              item.get("value"): item
              for item in provenance.get("assets", [])
              if item.get("type") == "domain"
          }
          missing = []
          for domain in domains:
              asset = assets.get(domain) or {}
              evidence_ids = asset.get("evidence_ids") or []
              official_verified = any(
                  evidence.get(evidence_id, {}).get("authority") == "official"
                  and evidence.get(evidence_id, {}).get("status") == "verified"
                  for evidence_id in evidence_ids
              )
              if not official_verified:
                  missing.append(domain)
          forbidden = {"cloudflare.com", "www.cloudflare.com"} & set(domains)
          if not domains:
              raise SystemExit("Cloudflare candidate is empty; keep Release BLOCKED")
          if forbidden:
              raise SystemExit(f"global CDN exclusions were bypassed: {sorted(forbidden)}")
          if missing:
              raise SystemExit(f"Cloudflare domains missing official verified evidence: {missing[:20]}")
          print(json.dumps({
              "service_id": "cloudflare",
              "snapshot_id": result["snapshot_id"],
              "release_state": result.get("release_state"),
              "domain_count": len(domains),
              "evidence_mapped": len(domains) - len(missing),
              "global_exclusion_preserved": True,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate snapshot schema
        run: python -m source_engine schema-validate

      - name: Create Cloudflare candidate review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/cloudflare-candidate-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add generated snapshots
          if git diff --cached --quiet; then
            echo "No Cloudflare candidate changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(source): refresh Cloudflare candidate snapshot"
          git push --set-upstream origin "$BRANCH"
          set +e
          PR_OUTPUT="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(source): refresh Cloudflare official service candidate" \
            --body "Targeted Cloudflare candidate refresh. This PR only updates candidate evidence/snapshot artifacts. It does not create a Durable Release, promote lifecycle state, or change Collection immutable bindings. Review exact domains and official evidence mapping before merge." 2>&1)"
          PR_STATUS=$?
          set -e
          if [ "$PR_STATUS" -ne 0 ]; then
            printf '%s\\n' "$PR_OUTPUT"
            if grep -qiE 'GitHub Actions is not permitted to create or approve pull requests|createPullRequest' <<< "$PR_OUTPUT"; then
              echo "::warning::Candidate branch pushed, but automatic PR creation is blocked by repository policy."
              printf 'handoff_status=PR_CREATE_BLOCKED\\nbranch=%s\\nrun_id=%s\\n' "$BRANCH" "$GITHUB_RUN_ID" > cloudflare-handoff.txt
              exit 0
            fi
            echo "::error::Cloudflare candidate PR creation failed."
            exit "$PR_STATUS"
          fi
          printf 'handoff_status=PR_CREATED\\nbranch=%s\\nrun_id=%s\\n' "$BRANCH" "$GITHUB_RUN_ID" > cloudflare-handoff.txt
          printf '%s\\n' "$PR_OUTPUT" > cloudflare-pr-url.txt
