name: Source Lifecycle Status

on:
  push:
    branches: [main]
    paths:
      - "config/source_canary_state.yaml"
      - "snapshots/**"
      - "releases/**"
      - ".github/workflows/status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine status
      - name: Commit generated lifecycle report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports/generated
          if git diff --cached --quiet; then
            echo "Status unchanged."
          else
            git commit -m "chore(source): refresh generated lifecycle status [skip ci]"
            git push origin main
          fi
