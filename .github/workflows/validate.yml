name: CI

on:
  push:
    branches: ["main", "feature/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m pytest -q
      - run: python -m source_engine generate --all
      - name: Enforce production qualification in CI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bad = []
          for path in Path("snapshots").glob("*/manifest.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("release_state") != "CANDIDATE":
                  bad.append({
                      "service": data.get("service_id"),
                      "state": data.get("release_state"),
                      "reasons": data.get("release_reasons", []),
                  })
          if bad:
              print(json.dumps(bad, ensure_ascii=False, indent=2))
              raise SystemExit("one or more services are not production-qualified")
          PY
      - run: python -m source_engine schema-validate
      - run: python -m source_engine conflict
      - run: python -m source_engine audit
