name: Reconcile with Popular-Rules-Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m source_engine reconcile
      - run: |
          git add reports/reconciliation.json
          git diff --cached --quiet || true
