name: Reconcile with Popular-Rules-Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 1"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m source_engine reconcile
      - uses: actions/upload-artifact@v4
        with:
          name: collection-reconciliation
          path: reports/reconciliation.json
