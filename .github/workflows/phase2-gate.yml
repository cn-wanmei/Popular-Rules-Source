name: Phase 2 Source Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase2-Popular-Rules-Source--github-workflows-phase2-gate-yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Exact Collection registration input for Batch2 Gate.
      COLLECTION_REF: 1e664a510a9aeb5f1383d9a3c74fb33c5b8cbd8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml"))
          files += sorted(Path(".github/workflows").glob("*.yaml"))
          if not files:
              raise SystemExit("No GitHub Actions workflow files found")

          for path in files:
              with path.open(encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"YAML OK: {path}")
          PY
      - run: python -m source_engine validate
      - run: python -m pytest -q
      - run: python -m source_engine generate --all --allow-blocked
      - run: python -m source_engine candidate-audit
      - run: python -m source_engine schema-validate
      - run: python -m source_engine conflict
      - run: python -m source_engine audit
      - name: Reconcile Collection registration before promotion
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          import unicodedata
          from pathlib import Path

          import requests
          import yaml

          ref = os.environ["COLLECTION_REF"]
          response = requests.get(
              "https://api.github.com/repos/cn-wanmei/Popular-Rules-Collection/contents/sources/registry.yaml",
              params={"ref": ref},
              timeout=20,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Popular-Rules-Source/3.x",
              },
          )
          response.raise_for_status()
          payload = response.json()
          content = base64.b64decode(
              str(payload["content"]).replace("\\n", "")
          ).decode("utf-8")
          registry = yaml.safe_load(content) or {}
          prs_entry = next(
              (
                  item for item in registry.get("sources", [])
                  if item.get("id") == "popular-rules-source"
              ),
              None,
          )
          if not isinstance(prs_entry, dict):
              raise SystemExit("Collection popular-rules-source registry entry missing")

          def canonical(value):
              normalized = unicodedata.normalize("NFKC", str(value)).strip().lower()
              return re.sub(r"[^a-z0-9]+", "", normalized)

          registered = {
              canonical(rule.get("service") or rule.get("name"))
              for rule in (prs_entry.get("rules") or [])
              if rule.get("service") or rule.get("name")
          }

          import source_engine.build as build
          required = {
              canonical(sid)
              for sid in build.load_services()["services"].keys()
          }
          print("COLLECTION_REGISTERED_DEBUG", sorted(repr(value) for value in registered))
          print("COLLECTION_REQUIRED_DEBUG", sorted(repr(value) for value in required))
          missing = sorted(required - registered)
          if missing:
              raise SystemExit(f"Collection registration reconciliation failed: {missing}")
          print(
              f"Collection registration reconciliation: PASS "
              f"(ref={ref}, registered={len(registered)}, required={len(required)})"
          )
          PY
      - run: python -m source_engine qualify
