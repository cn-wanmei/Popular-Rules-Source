name: Release Gate

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service ID to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m source_engine generate --service ${{ inputs.service }}
      - run: python -m source_engine release --service ${{ inputs.service }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.service }}
          path: |
            snapshots/
            generated/source/${{ inputs.service }}/
            releases/
