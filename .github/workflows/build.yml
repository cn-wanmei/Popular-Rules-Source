name: Build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m source_engine validate
      - run: python -m pytest -q
      - run: python -m source_engine test-determinism
      # Network generate is optional on PR; scheduled job handles live fetch
      - run: python -m source_engine audit
