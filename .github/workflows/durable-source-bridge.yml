name: Durable Source Bridge

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "reports/generated/**"
      - "reports/durable-bridge/**"
      - "config/source_canary_state.yaml"
      - ".github/workflows/branch-cleanup.yml"
      - ".github/workflows/durable-source-bridge.yml"
      - "docs/**"
      - "README.md"
      - ".github/workflows/**"
      - ".github/workflows/collection-handoff.yml"
  workflow_dispatch:
    inputs:
      services:
        description: "Reserved for future selective execution"
        required: false
        default: "1688,cainiao,dingding,qqmail,qqmusic,taobao,tencentcloud,tmall,appletv,baidunetdisk,doubao,firebase,github,googlecloud,googlefcm,tencentmeeting,wecom,youdao,wegame,honorofkings-cn,honorofkings-global,netease163mail,neteasegames,baidumaps,baiduwiki,baiduwenku,capcut,toutiao,xigua,volcengine,gmail,googlemaps,outlook,office"
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  release:
    name: Release ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [1688, cainiao, dingding, qqmail, qqmusic, taobao, tencentcloud, tmall, appletv, baidunetdisk, doubao, firebase, github, googlecloud, googlefcm, tencentmeeting, wecom, youdao, wegame, honorofkings-cn, honorofkings-global, netease163mail, neteasegames, baidumaps, baiduwiki, baiduwenku, capcut, toutiao, xigua, volcengine, gmail, googlemaps, outlook, office]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt
      - name: Validate source configuration
        run: python -m source_engine validate
      - name: Generate immutable snapshot
        run: python -m source_engine generate --service "${{ matrix.service }}"
      - name: Validate snapshot schema
        run: python -m source_engine schema-validate
      - name: Evidence candidate gate
        run: python -m source_engine candidate-audit
      - name: Conflict gate
        run: python -m source_engine conflict
      - name: Determinism gate
        run: python -m source_engine test-determinism
      - name: Create durable release
        run: python -m source_engine release --service "${{ matrix.service }}"
      - name: Verify release contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          service = "${{ matrix.service }}"
          provenance = Path("generated") / "source" / service / "provenance.json"
          if not provenance.is_file():
              raise SystemExit(f"generated provenance missing for {service}: {provenance}")
          manifest = json.loads(provenance.read_text(encoding="utf-8"))
          snapshot_id = str(manifest.get("snapshot_id") or "")
          if not snapshot_id:
              raise SystemExit(f"missing snapshot_id in generated provenance for {service}")
          release_state = str(manifest.get("release_state") or "BLOCKED")
          if release_state == "REVIEW":
              print(json.dumps({
                  "service": service,
                  "status": "REVIEW",
                  "snapshot_id": snapshot_id,
                  "release_reasons": manifest.get("release_reasons", []),
              }, ensure_ascii=False))
              raise SystemExit(0)
          if release_state != "CANDIDATE":
              raise SystemExit(f"source release blocked for {service}: {release_state}")
          release_path = Path("releases") / service / snapshot_id / "release.json"
          if not release_path.is_file():
              raise SystemExit(f"no durable release produced for {service}: {release_path}")
          release = json.loads(release_path.read_text(encoding="utf-8"))
          required = {"service_id", "snapshot_id", "content_digest", "evidence_digest", "policy_digest", "generator_digest", "release_digest", "checksums", "validation"}
          missing = sorted(required - release.keys())
          if missing:
              raise SystemExit(f"release contract missing: {missing}")
          if release["service_id"] != service:
              raise SystemExit("service_id mismatch")
          if release["snapshot_id"] != snapshot_id:
              raise SystemExit(f"snapshot_id mismatch: expected {snapshot_id}, got {release.get('snapshot_id')}")
          digest_keys = ("content_digest", "evidence_digest", "policy_digest", "generator_digest", "release_digest")
          for key in digest_keys:
              value = str(release.get(key) or "")
              if len(value) != 64 or any(ch not in "0123456789abcdef" for ch in value.lower()):
                  raise SystemExit(f"invalid {key} for {service}: {value}")
          if str(release.get("release_identity_version") or "") != "2":
              raise SystemExit(
                  f"invalid release_identity_version for {service}: "
                  f"{release.get('release_identity_version')}"
              )
          snapshot = Path("snapshots") / release["snapshot_id"]
          for name in ("domains.txt", "provenance.json", "manifest.json", "checksums.json"):
              if not (snapshot / name).is_file():
                  raise SystemExit(f"snapshot artifact missing: {snapshot / name}")
          print(json.dumps({"service": service, "release": str(release_path), "snapshot_id": release["snapshot_id"], "content_digest": release["content_digest"]}, ensure_ascii=False))
          PY
      - name: Upload durable candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-${{ matrix.service }}
          if-no-files-found: warn
          path: |
            snapshots/
            releases/
            generated/source/${{ matrix.service }}/

  persist:
    name: Persist durable snapshots
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: durable-*
          path: durable-artifacts
      - name: Merge verified artifacts and write bridge report
        run: |
          python - <<'PY'
          import json
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          artifact_root = root / "durable-artifacts"
          services = ["1688", "cainiao", "dingding", "qqmail", "qqmusic", "taobao", "tencentcloud", "tmall", "appletv", "baidunetdisk", "doubao", "firebase", "github", "googlecloud", "googlefcm", "tencentmeeting", "wecom", "youdao", "wegame", "honorofkings-cn", "honorofkings-global", "netease163mail", "neteasegames", "baidumaps", "baiduwiki", "baiduwenku", "capcut", "toutiao", "xigua", "volcengine", "gmail", "googlemaps", "outlook", "office"]
          report = {"schema": "popular_rules_source_durable_bridge_v2", "created_at": datetime.now(timezone.utc).isoformat(), "verified_input_commit": "${{ github.sha }}", "services": {}}

          for service in services:
              source_root = artifact_root / f"durable-{service}"
              provenance_path = source_root / "generated" / "source" / service / "provenance.json"
              if not provenance_path.is_file():
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated provenance missing"}
                  continue
              manifest = json.loads(provenance_path.read_text(encoding="utf-8"))
              snapshot_id = str(manifest.get("snapshot_id") or "")
              release_state = str(manifest.get("release_state") or "BLOCKED")
              if not snapshot_id:
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated provenance missing snapshot_id"}
                  continue

              snapshot = source_root / "snapshots" / snapshot_id
              required = ["domains.txt", "provenance.json", "manifest.json", "checksums.json"]
              missing = [name for name in required if not (snapshot / name).is_file()]
              if missing:
                  report["services"][service] = {
                      "status": "BLOCKED",
                      "reason": "snapshot artifact missing",
                      "missing": missing,
                      "snapshot_id": snapshot_id,
                  }
                  continue

              # REVIEW snapshots are durable audit evidence, but they must not
              # replace the currently published generated artifact/release.
              if release_state == "REVIEW":
                  dst = root / "snapshots" / snapshot_id
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.copytree(snapshot, dst)
                  report["services"][service] = {
                      "status": "REVIEW",
                      "snapshot_id": snapshot_id,
                      "content_digest": manifest.get("content_digest"),
                      "evidence_digest": manifest.get("evidence_digest"),
                      "policy_digest": manifest.get("policy_digest"),
                      "generator_digest": manifest.get("generator_digest"),
                      "release_digest": manifest.get("release_digest"),
                      "release_identity_version": manifest.get("release_identity_version"),
                      "release_reasons": manifest.get("release_reasons", []),
                      "review_snapshot_path": str(Path("snapshots") / snapshot_id),
                  }
                  continue

              if release_state != "CANDIDATE":
                  report["services"][service] = {
                      "status": "BLOCKED",
                      "reason": f"unsupported release state: {release_state}",
                      "snapshot_id": snapshot_id,
                  }
                  continue

              release_path = source_root / "releases" / service / snapshot_id / "release.json"
              if not release_path.is_file():
                  report["services"][service] = {
                      "status": "BLOCKED",
                      "reason": "current durable release missing",
                      "snapshot_id": snapshot_id,
                  }
                  continue
              release = json.loads(release_path.read_text(encoding="utf-8"))

              for rel in [Path("snapshots") / snapshot_id, Path("releases") / service / snapshot_id, Path("generated") / "source" / service]:
                  src = source_root / rel
                  if src.exists():
                      dst = root / rel
                      if dst.exists():
                          shutil.rmtree(dst) if dst.is_dir() else dst.unlink()
                      shutil.copytree(src, dst) if src.is_dir() else shutil.copy2(src, dst)

              domains_path = source_root / "generated" / "source" / service / "domains.txt"
              if not domains_path.is_file():
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated domains artifact missing"}
                  continue
              import hashlib
              expected_sha256 = hashlib.sha256(domains_path.read_bytes()).hexdigest()

              report["services"][service] = {
                  "status": "PERSISTED",
                  "snapshot_id": snapshot_id,
                  "content_digest": release["content_digest"],
                  "evidence_digest": release.get("evidence_digest"),
                  "policy_digest": release.get("policy_digest"),
                  "generator_digest": release.get("generator_digest"),
                  "release_digest": release.get("release_digest"),
                  "release_identity_version": release.get("release_identity_version"),
                  "release_path": str(Path("releases") / service / snapshot_id / "release.json"),
                  "expected_sha256": expected_sha256,
              }

          out = root / "reports" / "durable-bridge"
          out.mkdir(parents=True, exist_ok=True)
          (out / "latest.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          incomplete = sorted(
              service for service, item in report["services"].items()
              if item.get("status") == "BLOCKED"
          )
          if incomplete:
              raise SystemExit(f"durable bridge fail-closed: incomplete services: {incomplete}")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit persisted snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f snapshots releases generated/source
          if git diff --cached --quiet; then
            echo "No durable snapshot changes to persist."
          else
            git commit -m "chore(source): persist durable immutable snapshots [skip ci]"
            git push origin main
          fi
      - name: Seal bridge report with persistence commit
        run: |
          PERSISTED_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          from pathlib import Path
          path = Path("reports/durable-bridge/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["persistence_commit"] = "main@${PERSISTED_SHA}"
          data["persistence_commit"] = "${PERSISTED_SHA}"
          for item in data["services"].values():
              if item.get("status") == "PERSISTED":
                  item["source_ref"] = "${PERSISTED_SHA}"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git add -f reports/durable-bridge/latest.json
          git commit -m "chore(source): seal durable bridge evidence [skip ci]"
          git push origin main
