name: Durable Source Bridge

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "reports/generated/**"
      - "reports/durable-bridge/**"
      - "config/source_canary_state.yaml"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      services:
        description: "Selective execution: comma-separated service ids, or leave empty for default_processing_batch"
        required: false
        default: ""
        type: string

concurrency:
  group: durable-source-bridge-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      service_count: ${{ steps.plan.outputs.service_count }}
      planned_services: ${{ steps.plan.outputs.planned_services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Resolve service matrix
        id: plan
        env:
          SERVICES_INPUT: ${{ github.event.inputs.services || '' }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import yaml

          policy_path = Path("config/durable_release_policy.yaml")
          default = []
          if policy_path.is_file():
              policy = yaml.safe_load(policy_path.read_text(encoding="utf-8")) or {}
              default = list(policy.get("default_processing_batch") or [])

          if not default:
              raise SystemExit("default_processing_batch missing in durable_release_policy.yaml")

          raw = (os.environ.get("SERVICES_INPUT") or "").strip()
          if not raw or raw.lower() in ("default", "batch", "all-batch", "all"):
              services = default
              mode = "default_processing_batch"
          else:
              services = [s.strip() for s in re.split(r"[,;\s]+", raw) if s.strip()]
              mode = "selective"

          seen = set()
          ordered = []
          for s in services:
              if s not in seen:
                  seen.add(s)
                  ordered.append(s)

          if not ordered:
              raise SystemExit("empty service matrix")

          matrix = {"service": ordered}
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              fh.write(f"service_count={len(ordered)}\n")
              fh.write(f"planned_services={json.dumps(ordered, separators=(',', ':'))}\n")
          print(json.dumps({"mode": mode, "count": len(ordered), "services": ordered}, ensure_ascii=False))
          PY

  release:
    name: Release ${{ matrix.service }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.lock
      - name: Validate source configuration
        run: python -m source_engine validate
      - name: Generate immutable snapshot
        run: python -m source_engine generate --service "${{ matrix.service }}"
      - name: Validate snapshot schema
        run: python -m source_engine schema-validate
      - name: Evidence candidate gate
        run: python -m source_engine candidate-audit
      - name: Conflict gate
        run: python -m source_engine conflict
      - name: Determinism gate
        run: python -m source_engine test-determinism
      - name: Create durable release
        run: python -m source_engine release --service "${{ matrix.service }}"
      - name: Verify release contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          service = "${{ matrix.service }}"
          provenance = Path("generated") / "source" / service / "provenance.json"
          if not provenance.is_file():
              raise SystemExit(f"generated provenance missing for {service}: {provenance}")
          manifest = json.loads(provenance.read_text(encoding="utf-8"))
          snapshot_id = str(manifest.get("snapshot_id") or "")
          if not snapshot_id:
              raise SystemExit(f"missing snapshot_id in generated provenance for {service}")
          release_path = Path("releases") / service / snapshot_id / "release.json"
          if not release_path.is_file():
              raise SystemExit(f"no durable release produced for {service}: {release_path}")
          release = json.loads(release_path.read_text(encoding="utf-8"))
          required = {"service_id", "snapshot_id", "content_digest", "evidence_digest", "policy_digest", "generator_digest", "release_digest", "checksums", "validation"}
          missing = sorted(required - release.keys())
          if missing:
              raise SystemExit(f"release contract missing: {missing}")
          if release["service_id"] != service:
              raise SystemExit("service_id mismatch")
          if release["snapshot_id"] != snapshot_id:
              raise SystemExit(f"snapshot_id mismatch: expected {snapshot_id}, got {release.get('snapshot_id')}")
          digest_keys = ("content_digest", "evidence_digest", "policy_digest", "generator_digest", "release_digest")
          for key in digest_keys:
              value = str(release.get(key) or "")
              if len(value) != 64 or any(ch not in "0123456789abcdef" for ch in value.lower()):
                  raise SystemExit(f"invalid {key} for {service}: {value}")
          if str(release.get("release_identity_version") or "") != "2":
              raise SystemExit(
                  f"invalid release_identity_version for {service}: "
                  f"{release.get('release_identity_version')}"
              )
          snapshot = Path("snapshots") / release["snapshot_id"]
          for name in ("domains.txt", "provenance.json", "manifest.json", "checksums.json"):
              if not (snapshot / name).is_file():
                  raise SystemExit(f"snapshot artifact missing: {snapshot / name}")
          print(json.dumps({"service": service, "release": str(release_path), "snapshot_id": release["snapshot_id"], "content_digest": release["content_digest"]}, ensure_ascii=False))
          PY
      - name: Upload durable candidate
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-${{ matrix.service }}
          if-no-files-found: warn
          path: |
            snapshots/
            releases/
            generated/source/${{ matrix.service }}/

  persist:
    name: Persist durable snapshots
    needs: [plan, release]
    if: ${{ always() && needs.release.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: durable-*
          path: durable-artifacts
          merge-multiple: false
        continue-on-error: true
      - name: Verify artifacts downloaded
        run: |
          count=$(find durable-artifacts -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l || echo 0)
          echo "artifact dirs: $count"
          if [ "${count:-0}" -lt 1 ]; then
            echo "No durable artifacts downloaded; cannot persist"
            exit 1
          fi
      - name: Merge verified artifacts and write bridge report
        run: |
          python - <<'PY'
          import json
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          artifact_root = root / "durable-artifacts"
          service_roots = {}
          if artifact_root.is_dir():
              for p in artifact_root.rglob("*"):
                  if p.is_dir() and p.name.startswith("durable-") and p.name != "durable-artifacts":
                      sid = p.name[len("durable-"):]
                      if sid and sid not in service_roots:
                          service_roots[sid] = p
              if not service_roots:
                  for candidate in ("snapshots", "releases", "generated"):
                      if (artifact_root / candidate).exists():
                          service_roots["__flat__"] = artifact_root
                          break
          services = sorted(s for s in service_roots if s != "__flat__")
          print("artifact_top=", [x.name for x in artifact_root.iterdir()][:30] if artifact_root.is_dir() else [])
          print("service_roots=", {k: str(v) for k, v in service_roots.items()})
          planned_raw = """${{ needs.plan.outputs.planned_services }}"""
          try:
              planned_services = json.loads(planned_raw) if planned_raw.strip() else []
          except Exception:
              planned_services = []
          report = {
              "schema": "popular_rules_source_durable_bridge_v3",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "verified_input_commit": "${{ github.sha }}",
              "planned_service_count": "${{ needs.plan.outputs.service_count }}",
              "planned_services": planned_services,
              "services": {},
          }

          if not services and "__flat__" in service_roots:
              services = [str(s) for s in (planned_services or [])]
              for s in services:
                  service_roots[s] = service_roots["__flat__"]

          for service in services:
              source_root = service_roots.get(service) or (artifact_root / f"durable-{service}")
              releases = sorted((source_root / "releases" / service).glob("*/release.json")) if (source_root / "releases" / service).exists() else []
              if not releases:
                  report["services"][service] = {"status": "BLOCKED", "reason": "no durable release artifact"}
                  continue

              provenance_path = source_root / "generated" / "source" / service / "provenance.json"
              if not provenance_path.is_file():
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated provenance missing"}
                  continue
              manifest = json.loads(provenance_path.read_text(encoding="utf-8"))
              snapshot_id = str(manifest.get("snapshot_id") or "")
              if not snapshot_id:
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated provenance missing snapshot_id"}
                  continue
              release_path = source_root / "releases" / service / snapshot_id / "release.json"
              if not release_path.is_file():
                  report["services"][service] = {"status": "BLOCKED", "reason": "current durable release missing", "snapshot_id": snapshot_id}
                  continue
              release = json.loads(release_path.read_text(encoding="utf-8"))
              snapshot_id = release["snapshot_id"]
              snapshot = source_root / "snapshots" / snapshot_id
              required = ["domains.txt", "provenance.json", "manifest.json", "checksums.json"]
              missing = [name for name in required if not (snapshot / name).is_file()]
              if missing:
                  report["services"][service] = {"status": "BLOCKED", "reason": "snapshot artifact missing", "missing": missing, "snapshot_id": snapshot_id}
                  continue

              for rel in [Path("snapshots") / snapshot_id, Path("releases") / service / snapshot_id, Path("generated") / "source" / service]:
                  src = source_root / rel
                  if src.exists():
                      dst = root / rel
                      if dst.exists():
                          shutil.rmtree(dst) if dst.is_dir() else dst.unlink()
                      shutil.copytree(src, dst) if src.is_dir() else shutil.copy2(src, dst)

              domains_path = source_root / "generated" / "source" / service / "domains.txt"
              if not domains_path.is_file():
                  report["services"][service] = {"status": "BLOCKED", "reason": "generated domains artifact missing"}
                  continue
              import hashlib
              expected_sha256 = hashlib.sha256(domains_path.read_bytes()).hexdigest()

              report["services"][service] = {
                  "status": "PERSISTED",
                  "snapshot_id": snapshot_id,
                  "content_digest": release["content_digest"],
                  "evidence_digest": release.get("evidence_digest"),
                  "policy_digest": release.get("policy_digest"),
                  "generator_digest": release.get("generator_digest"),
                  "release_digest": release.get("release_digest"),
                  "release_identity_version": release.get("release_identity_version"),
                  "release_path": str(Path("releases") / service / snapshot_id / "release.json"),
                  "expected_sha256": expected_sha256,
              }

          out = root / "reports" / "durable-bridge"
          out.mkdir(parents=True, exist_ok=True)
          # Snapshot THIS RUN before historical seal merge (critical for run_completeness)
          run_services = dict(report.get("services") or {})
          report["executed_services"] = sorted(run_services.keys())
          report["run_service_status"] = {
              k: {"status": (v or {}).get("status")} for k, v in run_services.items()
          }
          prev_path = out / "latest.json"
          if prev_path.is_file():
              try:
                  prev = json.loads(prev_path.read_text(encoding="utf-8"))
                  prev_sv = prev.get("services") if isinstance(prev, dict) else {}
                  if isinstance(prev_sv, dict) and prev_sv:
                      merged = dict(prev_sv)
                      merged.update(run_services)
                      report["services"] = merged
                      report["merged_from"] = {
                          "previous_count": len(prev_sv),
                          "merged_count": len(merged),
                      }
              except Exception as exc:
                  print(f"WARN: could not merge previous durable report: {exc}")
          incomplete = sorted(
              service for service, item in report["services"].items()
              if item.get("status") != "PERSISTED"
          )
          report["incomplete"] = incomplete
          report["persisted_count"] = sum(1 for item in report["services"].values() if item.get("status") == "PERSISTED")
          planned = [str(s) for s in (report.get("planned_services") or [])]
          executed = [str(s) for s in (report.get("executed_services") or [])]
          report["executed_services"] = executed
          missing_from_execution = sorted(set(planned) - set(executed))
          report["missing_from_execution"] = missing_from_execution
          # run_* uses only this-run artifact outcomes, never historical seal
          run_persisted = sum(
              1 for s in planned
              if (run_services.get(s) or {}).get("status") == "PERSISTED"
          )
          run_blocked = [
              s for s in planned
              if s in run_services and (run_services.get(s) or {}).get("status") != "PERSISTED"
          ]
          if not planned:
              report["run_completeness"] = "FAILED"
          elif missing_from_execution or run_blocked:
              report["run_completeness"] = "PARTIAL" if run_persisted > 0 else "FAILED"
          elif run_persisted == len(planned):
              report["run_completeness"] = "COMPLETE"
          else:
              report["run_completeness"] = "PARTIAL"
          if not report["persisted_count"]:
              report["seal_completeness"] = "FAILED"
              report["batch_completeness"] = "FAILED"
              (out / "latest.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              raise SystemExit("durable bridge fail-closed: zero services persisted")
          elif incomplete:
              report["seal_completeness"] = "PARTIAL"
              report["batch_completeness"] = "PARTIAL"
              print(f"WARN seal PARTIAL incomplete={len(incomplete)}: {incomplete[:30]}")
          else:
              report["seal_completeness"] = "COMPLETE"
              report["batch_completeness"] = "COMPLETE"
          print(f"run_completeness={report['run_completeness']} seal_completeness={report['seal_completeness']}")
          (out / "latest.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit persisted snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f snapshots releases generated/source reports/durable-bridge/latest.json
          if git diff --cached --quiet; then
            echo "No durable snapshot changes to persist."
          else
            git commit -m "chore(source): persist durable immutable snapshots [skip ci]"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
      - name: Seal bridge report with persistence commit
        run: |
          PERSISTED_SHA=$(git rev-parse HEAD)
          python - <<PY
          import json
          from pathlib import Path
          path = Path("reports/durable-bridge/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["persistence_commit"] = "${PERSISTED_SHA}"
          for item in data["services"].values():
              if item.get("status") == "PERSISTED":
                  item["source_ref"] = "${PERSISTED_SHA}"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git add -f reports/durable-bridge/latest.json
          git commit -m "chore(source): seal durable bridge evidence [skip ci]"
          git fetch origin main
          git pull --rebase origin main
          git push origin main
