name: Branch cleanup

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-legacy:
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(repo): cleanup legacy branches')"
    runs-on: ubuntu-latest
    steps:
      - name: Delete confirmed obsolete branches
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const branches = [
              'activate/tencentcloud-production-current',
              'activate/qqmusic-production-20260921-current',
              'phase2/align-1688-production-evidence-20260921',
              'phase2/official-source-completion-20260920',
              'phase2/promote-1688-production-evidence-20260921',
              'phase2/promote-cainiao-production-20260921',
              'phase2/promote-qqmail-production-20260921',
              'phase2/source-main-gate-trigger-20260921',
              'fix/strict-lineage-bridge-20260921'
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) core.info(`Already absent: ${branch}`);
                else throw error;
              }
            }

  delete-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            if (pr.head.repo.full_name !== pr.base.repo.full_name) return;
            if (branch === pr.base.ref || branch === 'main') return;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted merged PR head branch: ${branch}`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
            }
